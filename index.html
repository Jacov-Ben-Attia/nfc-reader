<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>קורא NFC</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Roboto, Arial, sans-serif;
    background: #111827;
    color: #f3f4f6;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    min-height: 100vh;
    margin: 0;
  }
  h1 { font-size: 20px; margin-bottom: 8px; }
  #status {
    font-size: 14px;
    color: #9ca3af;
    margin-bottom: 20px;
    text-align: center;
  }
  button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 14px 28px;
    font-size: 16px;
    border-radius: 12px;
    margin-bottom: 20px;
    cursor: pointer;
  }
  button:disabled {
    background: #4b5563;
  }
  #result {
    width: 100%;
    max-width: 480px;
    background: #1f2937;
    border-radius: 12px;
    padding: 16px;
    min-height: 120px;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 15px;
    line-height: 1.6;
    border: 1px solid #374151;
  }
  .tag-line {
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid #374151;
  }
  .label { color: #60a5fa; font-weight: bold; }

  .tabs {
    display: flex;
    width: 100%;
    max-width: 480px;
    margin-bottom: 20px;
    background: #1f2937;
    border-radius: 12px;
    padding: 4px;
    gap: 4px;
  }
  .tab-btn {
    flex: 1;
    background: transparent;
    color: #9ca3af;
    border: none;
    padding: 10px;
    margin: 0;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  .tab-btn.active {
    background: #2563eb;
    color: white;
  }
  .panel { display: none; width: 100%; max-width: 480px; }
  .panel.active { display: flex; flex-direction: column; align-items: center; }

  .field {
    width: 100%;
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    font-size: 13px;
    color: #9ca3af;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #374151;
    background: #1f2937;
    color: #f3f4f6;
    font-size: 15px;
    direction: ltr;
    text-align: left;
  }
  .url-preview {
    width: 100%;
    background: #111827;
    border: 1px dashed #374151;
    border-radius: 10px;
    padding: 12px;
    font-size: 13px;
    color: #60a5fa;
    direction: ltr;
    text-align: left;
    word-break: break-all;
    margin-bottom: 16px;
  }
  #writeStatus {
    font-size: 14px;
    color: #9ca3af;
    margin-top: 12px;
    text-align: center;
    min-height: 20px;
  }
</style>
</head>
<body>

<h1>📡 כלי NFC</h1>

<div class="tabs">
  <button class="tab-btn active" id="tabReadBtn">קריאה</button>
  <button class="tab-btn" id="tabWriteBtn">כתיבה</button>
</div>

<!-- פאנל קריאה -->
<div class="panel active" id="readPanel">
  <div id="status">לחץ על הכפתור כדי להתחיל סריקה</div>
  <button id="scanBtn">התחל סריקה</button>
  <div id="result">התוצאות יופיעו כאן...</div>
</div>

<!-- פאנל כתיבה -->
<div class="panel" id="writePanel">
  <div class="field">
    <label>כתובת בסיס (Base URL)</label>
    <input type="text" id="baseUrl" placeholder="https://your-domain.local/index.html" value="https://your-domain.local/index.html">
  </div>
  <div class="field">
    <label>מזהה אזור (zone)</label>
    <input type="text" id="zoneId" placeholder="A1">
  </div>
  <div class="url-preview" id="urlPreview">https://your-domain.local/index.html?zone=</div>
  <button id="writeBtn">קרב תג וכתוב</button>
  <div id="writeStatus"></div>
</div>

<script>
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const scanBtn = document.getElementById('scanBtn');

function log(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.style.color = isError ? '#f87171' : '#9ca3af';
}

function decodeRecord(record) {
  try {
    if (record.recordType === "text") {
      const textDecoder = new TextDecoder(record.encoding || "utf-8");
      return textDecoder.decode(record.data);
    } else if (record.recordType === "url") {
      const textDecoder = new TextDecoder();
      return textDecoder.decode(record.data);
    } else {
      // ננסה לפענח כטקסט רגיל, ואם נכשל נציג hex
      try {
        const textDecoder = new TextDecoder("utf-8");
        return textDecoder.decode(record.data);
      } catch (e) {
        const bytes = new Uint8Array(record.data.buffer || record.data);
        return "[hex]: " + Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(' ');
      }
    }
  } catch (e) {
    return "(לא ניתן לפענח)";
  }
}

async function startScan() {
  if (!('NDEFReader' in window)) {
    log("הדפדפן לא תומך ב-Web NFC. יש להשתמש ב-Chrome על אנדרואיד, עם HTTPS.", true);
    return;
  }

  try {
    const ndef = new NDEFReader();
    await ndef.scan();
    log("✅ סורק... קרב תג NFC למכשיר");
    scanBtn.disabled = true;
    scanBtn.textContent = "סורק...";

    ndef.addEventListener("readingerror", () => {
      log("שגיאה בקריאת התג. נסה שוב.", true);
    });

    ndef.addEventListener("reading", ({ message, serialNumber }) => {
      log("✅ תג נקרא בהצלחה!");

      let html = `<div class="tag-line"><span class="label">מספר סידורי:</span> ${serialNumber || 'לא זמין'}</div>`;

      if (message.records.length === 0) {
        html += "התג ריק (אין רשומות NDEF)";
      } else {
        message.records.forEach((record, i) => {
          const decoded = decodeRecord(record);
          html += `<div class="tag-line">
            <span class="label">רשומה ${i + 1} (${record.recordType}):</span><br>
            ${decoded}
          </div>`;
        });
      }

      resultEl.innerHTML = html;
    });

  } catch (error) {
    log("שגיאה: " + error.message + " (וודא שהאתר נטען דרך HTTPS ושאישרת הרשאה)", true);
    scanBtn.disabled = false;
    scanBtn.textContent = "נסה שוב";
  }
}

scanBtn.addEventListener('click', startScan);

// --- טאבים ---
const tabReadBtn = document.getElementById('tabReadBtn');
const tabWriteBtn = document.getElementById('tabWriteBtn');
const readPanel = document.getElementById('readPanel');
const writePanel = document.getElementById('writePanel');

tabReadBtn.addEventListener('click', () => {
  tabReadBtn.classList.add('active');
  tabWriteBtn.classList.remove('active');
  readPanel.classList.add('active');
  writePanel.classList.remove('active');
});

tabWriteBtn.addEventListener('click', () => {
  tabWriteBtn.classList.add('active');
  tabReadBtn.classList.remove('active');
  writePanel.classList.add('active');
  readPanel.classList.remove('active');
});

// --- כתיבה ל-NFC ---
const baseUrlInput = document.getElementById('baseUrl');
const zoneIdInput = document.getElementById('zoneId');
const urlPreview = document.getElementById('urlPreview');
const writeBtn = document.getElementById('writeBtn');
const writeStatusEl = document.getElementById('writeStatus');

function buildUrl() {
  const base = (baseUrlInput.value || '').trim();
  const zone = (zoneIdInput.value || '').trim();
  if (!base) return '';
  const separator = base.includes('?') ? '&' : '?';
  return zone ? `${base}${separator}zone=${encodeURIComponent(zone)}` : base;
}

function updatePreview() {
  const url = buildUrl();
  urlPreview.textContent = url || 'הזן כתובת בסיס...';
}

baseUrlInput.addEventListener('input', updatePreview);
zoneIdInput.addEventListener('input', updatePreview);
updatePreview();

function writeLog(msg, isError = false) {
  writeStatusEl.textContent = msg;
  writeStatusEl.style.color = isError ? '#f87171' : '#9ca3af';
}

async function writeNFC() {
  if (!('NDEFReader' in window)) {
    writeLog("הדפדפן לא תומך ב-Web NFC. יש להשתמש ב-Chrome על אנדרואיד, עם HTTPS.", true);
    return;
  }

  const url = buildUrl();
  if (!url) {
    writeLog("יש להזין כתובת בסיס תחילה.", true);
    return;
  }

  try {
    const ndef = new NDEFReader();
    writeLog("קרב תג ריק (או תג לשכתוב) למכשיר...");
    writeBtn.disabled = true;
    writeBtn.textContent = "ממתין לתג...";

    await ndef.write({
      records: [{ recordType: "url", data: url }]
    });

    writeLog("✅ נכתב בהצלחה! התג עכשיו מפנה ל: " + url);
    writeBtn.disabled = false;
    writeBtn.textContent = "קרב תג וכתוב";

  } catch (error) {
    writeLog("שגיאה בכתיבה: " + error.message, true);
    writeBtn.disabled = false;
    writeBtn.textContent = "נסה שוב";
  }
}

writeBtn.addEventListener('click', writeNFC);
</script>

</body>
</html>
